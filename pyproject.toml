[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-dataset-audit-tool"
version = "0.1.0"
description = "A lightweight Python tool for auditing image classification datasets."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=12.3,<13",
    "matplotlib>=3.11,<4",
]

[project.scripts]
image-dataset-audit = "image_dataset_audit.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
